# Small real-data smoke window by default. Expand only after checking the plan.
schema_version: 1
study:
  region: GBR
profile: noaa_smoke
profiles:
  noaa_smoke: [noaa]
  transport: [noaa, physics, era5]
  ocean: [noaa, physics, bgc]
  daily: [noaa, physics, era5, bgc]
  gbr_long: [noaa, physics, era5, bgc]
  gbr_wave_public: [noaa, physics, bgc, waves]
  gbr_wave_long: [noaa, physics, era5, bgc, waves]
  gbr_all_daily: [noaa, physics, era5, bgc, waves, ereefs_bgc]
  gbr_rich: [noaa, physics, era5, ereefs_bgc]
  gbr_rich_public: [noaa, physics, ereefs_bgc]
  monthly_context: [bgc_monthly]
  static_context: [static]
time:
  start: '2018-01-01'
  end: '2018-01-03'
grid:
  # Edges; cells use centers, never the old inclusive-edge convention.
  lat_min: -18.0
  lat_max: -17.0
  lon_min: 146.0
  lon_max: 147.0
  resolution: 0.25
  tile_cells: 16
execution:
  workers: 2
  max_attempts: 3
  retry_base_seconds: 1.0
  timeout_seconds: 60
  source_deadline_seconds: 180 # Whole eReefs source, including metadata and data requests.
  max_download_mb: 128
  max_tile_mb: 64
  remote_cache_mb: 64 # Compressed native chunks reused in RAM, never on disk.
  max_scratch_mb: 512
  max_output_mb: 2048
  max_jobs: 10000
  max_missing_fraction: 0.05
  # Fail if versions are unresolved for a publication run.
  require_pinned_versions: false
storage:
  root: data/research
# Live public catalogs reviewed 2026-11-02. Publication runs should set
# require_pinned_versions=true and retain the catalog snapshot and output hashes.
versions:
  physics: '202311'
  bgc: '202406'
  bgc_monthly: '202406'
  static: '202406'
